<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Complet</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f5f5;
        }

        .pokemon-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .pokemon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .type {
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .type-normal { background-color: #A8A878; color: white; }
        .type-fire { background-color: #F08030; color: white; }
        .type-water { background-color: #6890F0; color: white; }
        .type-grass { background-color: #78C850; color: white; }
        .type-electric { background-color: #F8D030; color: black; }
        .type-ice { background-color: #98D8D8; color: black; }
        .type-fighting { background-color: #C03028; color: white; }
        .type-poison { background-color: #A040A0; color: white; }
        .type-ground { background-color: #E0C068; color: black; }
        .type-flying { background-color: #A890F0; color: white; }
        .type-psychic { background-color: #F85888; color: white; }
        .type-bug { background-color: #A8B820; color: white; }
        .type-rock { background-color: #B8A038; color: white; }
        .type-ghost { background-color: #705898; color: white; }
        .type-dragon { background-color: #7038F8; color: white; }
        .type-dark { background-color: #705848; color: white; }
        .type-steel { background-color: #B8B8D0; color: black; }
        .type-fairy { background-color: #EE99AC; color: black; }

        .progress-bar {
            height: 8px;
            border-radius: 4px;
            transition: width 1s ease-in-out;
        }

        .stats-hp { background-color: #FF5959; }
        .stats-attack { background-color: #F5AC78; }
        .stats-defense { background-color: #FAE078; }
        .stats-special-attack { background-color: #9DB7F5; }
        .stats-special-defense { background-color: #A7DB8D; }
        .stats-speed { background-color: #FA92B2; }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            z-index: 1000;
        }

        .pokeball {
            width: 60px;
            height: 60px;
            background-color: #fff;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            border: 3px solid #000;
            animation: shake 1.5s ease-in-out infinite;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .pokeball::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #f00;
        }

        .pokeball::after {
            content: "";
            position: absolute;
            top: calc(50% - 5px);
            left: 0;
            width: 100%;
            height: 10px;
            background-color: #000;
        }

        .pokeball-button {
            width: 20px;
            height: 20px;
            background-color: #fff;
            border: 3px solid #000;
            border-radius: 50%;
            position: absolute;
            top: calc(50% - 10px);
            left: calc(50% - 10px);
            z-index: 10;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0); }
            20% { transform: translate(-10px, 0) rotate(-20deg); }
            30% { transform: translate(10px, 0) rotate(20deg); }
            50% { transform: translate(-10px, 0) rotate(-10deg); }
            60% { transform: translate(10px, 0) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0); }
        }

        .evo-arrow {
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animation pour les sprites */
        .sprite-animation {
            transition: transform 0.3s ease;
        }
        
        .sprite-animation:hover {
            transform: scale(1.2);
        }

        /* Animation pour l'apparition des pokémon */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Loading Overlay -->
    <div id="loading" class="loading-container">
        <div class="pokeball">
            <div class="pokeball-button"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-red-600 text-white p-6 shadow-lg">
        <div class="container mx-auto flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center mb-4 md:mb-0">
                <h1 class="text-3xl font-bold">Pokédex Complet</h1>
            </div>
            <div class="w-full md:w-1/3">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Rechercher un Pokémon..."
                        class="w-full px-4 py-2 rounded-full text-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500">
                    <button class="absolute right-0 top-0 mt-2 mr-4 text-gray-600">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto p-6">
        <!-- Filters and Sorting -->
        <div class="mb-8 bg-white rounded-lg shadow-md p-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="mb-4 md:mb-0">
                    <label class="font-semibold mr-2">Trier par:</label>
                    <select id="sortSelect" class="border rounded px-3 py-1 focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="id">Numéro</option>
                        <option value="name">Nom (A-Z)</option>
                    </select>
                </div>
                <div class="mb-4 md:mb-0">
                    <label class="font-semibold mr-2">Type:</label>
                    <select id="typeFilter" class="border rounded px-3 py-1 focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="">Tous les types</option>
                        <option value="normal">Normal</option>
                        <option value="fire">Feu</option>
                        <option value="water">Eau</option>
                        <option value="grass">Plante</option>
                        <option value="electric">Électrique</option>
                        <option value="ice">Glace</option>
                        <option value="fighting">Combat</option>
                        <option value="poison">Poison</option>
                        <option value="ground">Sol</option>
                        <option value="flying">Vol</option>
                        <option value="psychic">Psy</option>
                        <option value="bug">Insecte</option>
                        <option value="rock">Roche</option>
                        <option value="ghost">Spectre</option>
                        <option value="dragon">Dragon</option>
                        <option value="dark">Ténèbres</option>
                        <option value="steel">Acier</option>
                        <option value="fairy">Fée</option>
                    </select>
                </div>
                <div>
                    <label class="font-semibold mr-2">Génération:</label>
                    <select id="genFilter" class="border rounded px-3 py-1 focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="">Toutes les générations</option>
                        <option value="1">Génération I</option>
                        <option value="2">Génération II</option>
                        <option value="3">Génération III</option>
                        <option value="4">Génération IV</option>
                        <option value="5">Génération V</option>
                        <option value="6">Génération VI</option>
                        <option value="7">Génération VII</option>
                        <option value="8">Génération VIII</option>
                        <option value="9">Génération IX</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Pokemon Grid -->
        <div id="pokemonGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <!-- Pokemon cards will be inserted here dynamically -->
        </div>

        <!-- Pagination -->
        <div class="mt-8 flex justify-center">
            <div class="flex space-x-2">
                <button id="prevBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-chevron-left mr-1"></i> Précédent
                </button>
                <button id="nextBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    Suivant <i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Pokemon Details Modal -->
    <div id="pokemonModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-screen overflow-y-auto">
            <div id="modalContent" class="p-6 relative">
                <!-- Pokemon details will be inserted here dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let allPokemon = [];
        let currentPokemon = null;
        let currentPage = 0;
        let currentOffset = 0;
        const itemsPerPage = 24;
        const generations = {
            1: { offset: 0, limit: 151 },
            2: { offset: 151, limit: 100 },
            3: { offset: 251, limit: 135 },
            4: { offset: 386, limit: 107 },
            5: { offset: 493, limit: 156 },
            6: { offset: 649, limit: 72 },
            7: { offset: 721, limit: 88 },
            8: { offset: 809, limit: 96 },
            9: { offset: 905, limit: 103 }
        };

        // DOM Elements
        const pokemonGrid = document.getElementById('pokemonGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const typeFilter = document.getElementById('typeFilter');
        const genFilter = document.getElementById('genFilter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pokemonModal = document.getElementById('pokemonModal');
        const modalContent = document.getElementById('modalContent');
        const loadingOverlay = document.getElementById('loading');

        // Event Listeners
        document.addEventListener('DOMContentLoaded', initialize);
        searchInput.addEventListener('input', filterPokemon);
        sortSelect.addEventListener('change', sortPokemon);
        typeFilter.addEventListener('change', filterPokemon);
        genFilter.addEventListener('change', applyGenFilter);
        prevBtn.addEventListener('click', goToPrevPage);
        nextBtn.addEventListener('click', goToNextPage);
        pokemonModal.addEventListener('click', (e) => {
            if (e.target === pokemonModal) {
                closeModal();
            }
        });

        // Functions
        async function initialize() {
            showLoading();
            try {
                await fetchPokemon();
                renderPokemonCards();
            } catch (error) {
                console.error('Erreur lors de l\'initialisation:', error);
                alert('Une erreur est survenue lors du chargement des données.');
            } finally {
                hideLoading();
            }
        }

        async function fetchPokemon() {
            const limit = itemsPerPage;
            const selectedGen = genFilter.value;

            if (selectedGen) {
                const gen = generations[selectedGen];
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon?offset=${gen.offset}&limit=${gen.limit}`);
                const data = await response.json();
                allPokemon = data.results;
            } else {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon?offset=${currentOffset}&limit=${limit}`);
                const data = await response.json();
                allPokemon = data.results;

                // Update pagination
                prevBtn.disabled = currentOffset === 0;
                nextBtn.disabled = !data.next;
            }
        }

        function renderPokemonCards() {
            pokemonGrid.innerHTML = '';

            allPokemon.forEach(async (pokemon, index) => {
                const card = document.createElement('div');
                card.className = 'pokemon-card bg-white rounded-xl shadow-md overflow-hidden flex flex-col items-center p-4 cursor-pointer hover:shadow-lg fade-in';
                card.style.animationDelay = `${index * 0.05}s`;

                // Extract the pokemon ID from the URL
                const id = getPokemonIdFromUrl(pokemon.url);
                
                card.innerHTML = `
                    <div class="w-full flex justify-between items-center mb-2">
                        <span class="text-gray-500 font-semibold">#${id.toString().padStart(3, '0')}</span>
                    </div>
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" 
                         alt="${pokemon.name}" 
                         class="w-32 h-32 object-contain sprite-animation">
                    <h2 class="text-lg font-semibold mt-2 capitalize">${formatPokemonName(pokemon.name)}</h2>
                    <div class="pokemon-types-${id} flex space-x-2 mt-2">
                        <div class="loading-types">Chargement...</div>
                    </div>
                `;

                card.addEventListener('click', () => openPokemonDetails(id));
                pokemonGrid.appendChild(card);

                // Fetch and display pokemon types
                fetchPokemonTypes(id);
            });
        }

        async function fetchPokemonTypes(id) {
            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
                const pokemon = await response.json();
                const typesContainer = document.querySelector(`.pokemon-types-${id}`);
                
                if (typesContainer) {
                    typesContainer.innerHTML = '';
                    pokemon.types.forEach(typeInfo => {
                        const typeElement = document.createElement('span');
                        typeElement.className = `type type-${typeInfo.type.name}`;
                        typeElement.textContent = formatPokemonName(typeInfo.type.name);
                        typesContainer.appendChild(typeElement);
                    });
                }
            } catch (error) {
                console.error(`Erreur lors du chargement des types pour le Pokémon #${id}:`, error);
            }
        }

        async function openPokemonDetails(id) {
            showLoading();
            try {
                currentPokemon = await fetchPokemonDetails(id);
                const species = await fetchPokemonSpecies(id);
                const evolutionChain = await fetchEvolutionChain(species.evolution_chain.url);

                renderPokemonDetails(currentPokemon, species, evolutionChain);
                pokemonModal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                console.error('Erreur lors du chargement des détails:', error);
                alert('Une erreur est survenue lors du chargement des détails du Pokémon.');
            } finally {
                hideLoading();
            }
        }

        async function fetchPokemonDetails(id) {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
            return await response.json();
        }

        async function fetchPokemonSpecies(id) {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
            return await response.json();
        }

        async function fetchEvolutionChain(url) {
            const response = await fetch(url);
            return await response.json();
        }

        function renderPokemonDetails(pokemon, species, evolutionChain) {
            const types = pokemon.types.map(type => 
                `<span class="type type-${type.type.name}">${formatPokemonName(type.type.name)}</span>`
            ).join('');

            const stats = pokemon.stats.map(stat => {
                const statPercentage = (stat.base_stat / 255) * 100;
                const statName = formatStatName(stat.stat.name);
                const statClass = `stats-${stat.stat.name.replace('-', '-')}`;

                return `
                <div class="mb-2">
                    <div class="flex justify-between mb-1">
                        <span class="font-medium">${statName}</span>
                        <span class="font-medium">${stat.base_stat}</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="progress-bar ${statClass}" style="width: ${statPercentage}%"></div>
                    </div>
                </div>`;
            }).join('');

            // Get description in French if available
            const description = getDescription(species);

            // Get abilities
            const abilities = pokemon.abilities.map(ability => 
                `<span class="bg-gray-200 px-3 py-1 rounded-full text-sm">${formatPokemonName(ability.ability.name)}</span>`
            ).join('');

            // Sprites section with animations
            const sprites = getSpritesHTML(pokemon);

            // Evolution chain
            const evolutionHTML = renderEvolutionChain(evolutionChain);

            modalContent.innerHTML = `
                <button id="closeModal" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
                
                <div class="flex flex-col md:flex-row">
                    <!-- Left column - Image and basic info -->
                    <div class="w-full md:w-1/3 flex flex-col items-center">
                        <div class="bg-gray-100 rounded-full p-8 mb-4">
                            <img src="${pokemon.sprites.other["official-artwork"].front_default || pokemon.sprites.front_default}" 
                                alt="${pokemon.name}" 
                                class="w-full h-auto max-w-xs mx-auto">
                        </div>
                        
                        <div class="text-center">
                            <span class="text-gray-500 font-bold text-xl">#${pokemon.id.toString().padStart(3, '0')}</span>
                            <h1 class="text-3xl font-bold capitalize mb-2">${formatPokemonName(pokemon.name)}</h1>
                            
                            <div class="flex justify-center space-x-2 mb-4">
                                ${types}
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4 text-center">
                                <div>
                                    <p class="text-gray-500">Taille</p>
                                    <p class="font-semibold">${(pokemon.height / 10).toLocaleString()} m</p>
                                </div>
                                <div>
                                    <p class="text-gray-500">Poids</p>
                                    <p class="font-semibold">${(pokemon.weight / 10).toLocaleString()} kg</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Right column - Stats and details -->
                    <div class="w-full md:w-2/3 md:pl-8 mt-8 md:mt-0">
                        <div class="mb-6">
                            <h2 class="text-xl font-bold mb-3">Description</h2>
                            <p class="text-gray-700">${description}</p>
                        </div>
                        
                        <div class="mb-6">
                            <h2 class="text-xl font-bold mb-3">Capacités</h2>
                            <div class="flex flex-wrap gap-2">
                                ${abilities}
                            </div>
                        </div>
                        
                        <div class="mb-6">
                            <h2 class="text-xl font-bold mb-3">Statistiques de base</h2>
                            ${stats}
                        </div>
                    </div>
                </div>
                
                <!-- Sprites and Animations -->
                <div class="mt-8">
                    <h2 class="text-xl font-bold mb-4">Sprites et Animations</h2>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        ${sprites}
                    </div>
                </div>
                
                <!-- Evolution Chain -->
                <div class="mt-8">
                    <h2 class="text-xl font-bold mb-4">Chaîne d'évolution</h2>
                    <div class="evolution-chain flex flex-wrap justify-center items-center">
                        ${evolutionHTML}
                    </div>
                </div>
            `;

            // Add event listener to close button
            document.getElementById('closeModal').addEventListener('click', closeModal);
        }

        function getSpritesHTML(pokemon) {
            let spritesHTML = '';
            const sprites = pokemon.sprites;
            
            // Default sprites
            if (sprites.front_default) {
                spritesHTML += createSpriteCard(sprites.front_default, 'Normal (Front)');
            }
            if (sprites.back_default) {
                spritesHTML += createSpriteCard(sprites.back_default, 'Normal (Back)');
            }
            if (sprites.front_shiny) {
                spritesHTML += createSpriteCard(sprites.front_shiny, 'Shiny (Front)');
            }
            if (sprites.back_shiny) {
                spritesHTML += createSpriteCard(sprites.back_shiny, 'Shiny (Back)');
            }
            
            // Animated sprites from Showdown (if available)
            if (sprites.other && sprites.other.showdown) {
                if (sprites.other.showdown.front_default) {
                    spritesHTML += createSpriteCard(sprites.other.showdown.front_default, 'Animation (Normal)', true);
                }
                if (sprites.other.showdown.back_default) {
                    spritesHTML += createSpriteCard(sprites.other.showdown.back_default, 'Animation (Back)', true);
                }
                if (sprites.other.showdown.front_shiny) {
                    spritesHTML += createSpriteCard(sprites.other.showdown.front_shiny, 'Animation (Shiny)', true);
                }
                if (sprites.other.showdown.back_shiny) {
                    spritesHTML += createSpriteCard(sprites.other.showdown.back_shiny, 'Animation (Shiny Back)', true);
                }
            }
            
            return spritesHTML;
        }

        function createSpriteCard(url, label, isAnimated = false) {
            return `
            <div class="bg-gray-100 rounded-lg p-3 flex flex-col items-center">
                <img src="${url}" alt="${label}" class="w-20 h-20 object-contain sprite-animation">
                <p class="text-xs text-center mt-2">${label}</p>
                ${isAnimated ? '<span class="text-xs text-green-500">Animé</span>' : ''}
            </div>`;
        }

        function renderEvolutionChain(evolutionChain) {
            let html = '';
            const chain = evolutionChain.chain;
            
            // Start with the base form
            const basePokemon = chain.species;
            const baseId = getPokemonIdFromUrl(basePokemon.url);
            
            html += createEvolutionPokemonCard(baseId, basePokemon.name);
            
            // First evolution
            if (chain.evolves_to && chain.evolves_to.length > 0) {
                chain.evolves_to.forEach(evolution => {
                    const evoId = getPokemonIdFromUrl(evolution.species.url);
                    
                    // Get evolution details
                    const evoDetails = getEvolutionDetails(evolution.evolution_details[0]);
                    
                    html += `
                    <div class="evo-arrow mx-2">
                        <i class="fas fa-arrow-right text-gray-400"></i>
                        <div class="text-xs text-center mt-1">${evoDetails}</div>
                    </div>`;
                    
                    html += createEvolutionPokemonCard(evoId, evolution.species.name);
                    
                    // Second evolution
                    if (evolution.evolves_to && evolution.evolves_to.length > 0) {
                        evolution.evolves_to.forEach(subEvolution => {
                            const subEvoId = getPokemonIdFromUrl(subEvolution.species.url);
                            
                            // Get evolution details
                            const subEvoDetails = getEvolutionDetails(subEvolution.evolution_details[0]);
                            
                            html += `
                            <div class="evo-arrow mx-2">
                                <i class="fas fa-arrow-right text-gray-400"></i>
                                <div class="text-xs text-center mt-1">${subEvoDetails}</div>
                            </div>`;
                            
                            html += createEvolutionPokemonCard(subEvoId, subEvolution.species.name);
                        });
                    }
                });
            }
            
            return html;
        }

        function createEvolutionPokemonCard(id, name) {
            return `
            <div class="evolution-pokemon flex flex-col items-center p-2 cursor-pointer" onclick="openPokemonDetails(${id})">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" 
                     alt="${name}" 
                     class="w-20 h-20 object-contain sprite-animation">
                <h4 class="text-sm font-semibold mt-1 capitalize">${formatPokemonName(name)}</h4>
                <span class="text-xs text-gray-500">#${id.toString().padStart(3, '0')}</span>
            </div>`;
        }

        function getEvolutionDetails(details) {
            if (!details) return "???";
            
            if (details.min_level) {
                return `Niveau ${details.min_level}`;
            } else if (details.item) {
                return `Pierre ${formatPokemonName(details.item.name)}`;
            } else if (details.held_item) {
                return `Tenir ${formatPokemonName(details.held_item.name)}`;
            } else if (details.min_happiness) {
                return `Bonheur ${details.min_happiness}`;
            } else if (details.time_of_day) {
                return details.time_of_day === 'day' ? 'Jour' : 'Nuit';
            } else if (details.trade_species) {
                return `Échange avec ${formatPokemonName(details.trade_species.name)}`;
            } else if (details.known_move) {
                return `Connaître ${formatPokemonName(details.known_move.name)}`;
            } else {
                return "Échange";
            }
        }

        function getDescription(species) {
            // Try to get French description first
            const frEntries = species.flavor_text_entries.filter(entry => entry.language.name === 'fr');
            if (frEntries.length > 0) {
                return frEntries[0].flavor_text.replace(/\f/g, ' ');
            }
            
            // Fallback to English
            const enEntries = species.flavor_text_entries.filter(entry => entry.language.name === 'en');
            if (enEntries.length > 0) {
                return enEntries[0].flavor_text.replace(/\f/g, ' ');
            }
            
            return "Aucune description disponible.";
        }

        function closeModal() {
            pokemonModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function filterPokemon() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedType = typeFilter.value;
            
            if (!searchTerm && !selectedType) {
                renderPokemonCards();
                return;
            }
            
            // Filter visible pokemon cards
            const cards = pokemonGrid.querySelectorAll('.pokemon-card');
            cards.forEach(card => {
                const pokemonName = card.querySelector('h2').textContent.toLowerCase();
                const pokemonId = parseInt(card.querySelector('.text-gray-500').textContent.replace('#', ''));
                const typeElements = card.querySelectorAll('.type');
                const types = Array.from(typeElements).map(el => el.textContent.toLowerCase());
                
                const nameMatch = pokemonName.includes(searchTerm) || pokemonId.toString().includes(searchTerm);
                const typeMatch = !selectedType || types.includes(selectedType.toLowerCase());
                
                if (nameMatch && typeMatch) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        async function applyGenFilter() {
            showLoading();
            currentOffset = 0;
            try {
                await fetchPokemon();
                renderPokemonCards();
            } catch (error) {
                console.error('Erreur lors du filtrage par génération:', error);
            } finally {
                hideLoading();
            }
        }

        function sortPokemon() {
            const sortBy = sortSelect.value;
            const cards = Array.from(pokemonGrid.children);
            
            cards.sort((a, b) => {
                if (sortBy === 'name') {
                    const nameA = a.querySelector('h2').textContent.toLowerCase();
                    const nameB = b.querySelector('h2').textContent.toLowerCase();
                    return nameA.localeCompare(nameB);
                } else {
                    const idA = parseInt(a.querySelector('.text-gray-500').textContent.replace('#', ''));
                    const idB = parseInt(b.querySelector('.text-gray-500').textContent.replace('#', ''));
                    return idA - idB;
                }
            });
            
            // Re-append sorted cards
            pokemonGrid.innerHTML = '';
            cards.forEach(card => pokemonGrid.appendChild(card));
        }

        async function goToPrevPage() {
            if (currentOffset === 0) return;
            
            showLoading();
            currentOffset = Math.max(0, currentOffset - itemsPerPage);
            try {
                await fetchPokemon();
                renderPokemonCards();
            } catch (error) {
                console.error('Erreur lors du chargement de la page précédente:', error);
            } finally {
                hideLoading();
            }
        }

        async function goToNextPage() {
            showLoading();
            currentOffset += itemsPerPage;
            try {
                await fetchPokemon();
                renderPokemonCards();
            } catch (error) {
                console.error('Erreur lors du chargement de la page suivante:', error);
            } finally {
                hideLoading();
            }
        }

        function getPokemonIdFromUrl(url) {
            const parts = url.split('/');
            return parseInt(parts[parts.length - 2]);
        }

        function formatPokemonName(name) {
            return name
                .replace('-', ' ')
                .replace(/\b\w/g, l => l.toUpperCase());
        }

        function formatStatName(statName) {
            switch (statName) {
                case 'hp': return 'HP';
                case 'attack': return 'Attaque';
                case 'defense': return 'Défense';
                case 'special-attack': return 'Attaque Spé.';
                case 'special-defense': return 'Défense Spé.';
                case 'speed': return 'Vitesse';
                default: return statName;
            }
        }

        function showLoading() {
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            loadingOverlay.style.display = 'none';
        }

        // For evolution chain clicks from within the modal
        window.openPokemonDetails = openPokemonDetails;
    </script>
</body>
</html>
